<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>苏超看球助手 MVP</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .sub {
      color: #6b7280;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    label {
      display: block;
      margin: 14px 0 8px;
      font-weight: 600;
    }

    input, select, button {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      padding: 12px 14px;
      font-size: 15px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      margin-top: 16px;
      background: #111827;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover { opacity: 0.95; }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #6b7280;
      line-height: 1.7;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    .status.info { color: #2563eb; }
    .status.error { color: #dc2626; }

    #map {
      width: 100%;
      height: 560px;
      border-radius: 18px;
      overflow: hidden;
      background: #eef2ff;
    }

    .map-legend {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-top: 10px;
      font-size: 13px;
      color: #4b5563;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      display: inline-block;
    }

    .legend-dot.food {
      background: #2563eb;
    }

    .legend-dot.spot {
      background: #16a34a;
    }

    .result-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .kv {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 8px;
      font-size: 14px;
      line-height: 1.7;
      margin: 4px 0;
    }

    .kv .k { color: #6b7280; }

    .section-title {
      margin-top: 16px;
      margin-bottom: 10px;
      font-weight: 800;
      font-size: 16px;
    }

    .section-title.small {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .score-box {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .score-item {
      background: #f8fafc;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }

    .score-item .num {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .muted { color: #6b7280; }

    ul {
      padding-left: 18px;
      margin: 8px 0;
    }

    li { margin-bottom: 8px; }

    .small {
      font-size: 12px;
      color: #6b7280;
      margin-top: 8px;
      line-height: 1.6;
      word-break: break-all;
    }

    .poi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    .poi-panel {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px;
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: 1fr;
      }

      #map {
        height: 420px;
      }
    }

    @media (max-width: 720px) {
      .poi-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>苏超看球助手 MVP</h1>
    <div class="sub">
      输入你支持的球队和出发地。系统会优先在该球队参与的比赛中推荐一场最适合去看的比赛，并展示驾车路线、附近餐饮和附近景点。
    </div>

    <div class="grid">
      <div class="card">
        <label for="team">支持的球队</label>
        <select id="team">
          <option value="南京队">南京队</option>
          <option value="苏州队">苏州队</option>
          <option value="无锡队">无锡队</option>
          <option value="常州队">常州队</option>
          <option value="南通队">南通队</option>
          <option value="徐州队">徐州队</option>
          <option value="扬州队">扬州队</option>
          <option value="镇江队">镇江队</option>
          <option value="盐城队">盐城队</option>
        </select>

        <label for="origin">你的出发地</label>
        <input id="origin" type="text" placeholder="例如：苏州站 / 南京南站 / 无锡市政府" />

        <button id="recommendBtn">开始推荐</button>

        <div class="status info" id="infoBox"></div>
        <div class="status error" id="errorBox"></div>

        
      </div>

      <div>
        <div class="card" style="margin-bottom: 20px;">
          <div id="resultEmpty" class="muted">
            还没有结果。点击“开始推荐”后，这里会显示推荐比赛、路线、附近餐饮和景点。
          </div>

          <div id="resultContent" style="display:none;">
            <div class="pill">推荐结果</div>
            <div class="result-title" id="matchTitle"></div>

            <div class="kv"><div class="k">比赛时间</div><div id="matchDate"></div></div>
            <div class="kv"><div class="k">球场</div><div id="venueName"></div></div>
            <div class="kv"><div class="k">球场地址</div><div id="venueAddress"></div></div>
            <div class="kv"><div class="k">推荐理由</div><div id="reason"></div></div>

            <div class="score-box">
              <div class="score-item">
                <div class="num" id="travelTime">--</div>
                <div class="muted">预计耗时</div>
              </div>
              <div class="score-item">
                <div class="num" id="travelDistance">--</div>
                <div class="muted">预计距离</div>
              </div>
              <div class="score-item">
                <div class="num" id="matchScore">--</div>
                <div class="muted">推荐分</div>
              </div>
            </div>

            <div class="poi-grid">
              <div class="poi-panel">
                <div class="section-title small">附近 3 家餐饮</div>
                <ul id="restaurantList"></ul>
              </div>

              <div class="poi-panel">
                <div class="section-title small">附近 3 处景点</div>
                <ul id="spotList"></ul>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div id="map"></div>

          <div class="map-legend">
            <span class="legend-item">
              <span class="legend-dot food"></span>餐饮
            </span>
            <span class="legend-item">
              <span class="legend-dot spot"></span>景点
            </span>
          </div>

          <div class="small" id="debugBox"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const AMAP_KEY = '07eede2236d2aa14e532fb06da994d23';
    const AMAP_SECURITY_JS_CODE = '8082de79b33504459b6317cec193d823';

    const matches = [
      {
        id: 1,
        home: '南京队',
        away: '苏州队',
        date: '2026-05-10 19:30',
        venue: '南京奥体中心体育场',
        address: '南京市建邺区江东中路222号',
        lnglat: [118.725272, 32.004202],
        heat: 92
      },
      {
        id: 2,
        home: '无锡队',
        away: '常州队',
        date: '2026-05-12 19:30',
        venue: '无锡体育中心体育场',
        address: '无锡市滨湖区太湖西大道1500号',
        lnglat: [120.27062, 31.55088],
        heat: 80
      },
      {
        id: 3,
        home: '南通队',
        away: '徐州队',
        date: '2026-05-15 19:30',
        venue: '南通足球训练中心海门基地',
        address: '南通市海门区广州路1000号',
        lnglat: [121.13663, 31.89658],
        heat: 76
      },
      {
        id: 4,
        home: '扬州队',
        away: '镇江队',
        date: '2026-05-18 19:30',
        venue: '扬州体育公园体育场',
        address: '扬州市邗江区文昌西路476号',
        lnglat: [119.36342, 32.40053],
        heat: 74
      },
      {
        id: 5,
        home: '苏州队',
        away: '无锡队',
        date: '2026-05-22 19:30',
        venue: '苏州市体育中心体育场',
        address: '苏州市姑苏区三香路183号',
        lnglat: [120.585316, 31.302804],
        heat: 88
      },
      {
        id: 6,
        home: '盐城队',
        away: '南京队',
        date: '2026-05-25 19:30',
        venue: '盐城奥体中心体育场',
        address: '盐城奥体中心体育场',
        heat: 82
      }
    ];

    let map = null;
    let geocoder = null;
    let placeSearch = null;
    let drivingDisplay = null;
    let markers = [];

    function showInfo(msg) {
      const el = document.getElementById('infoBox');
      el.style.display = 'block';
      el.textContent = msg;
    }

    function hideInfo() {
      const el = document.getElementById('infoBox');
      el.style.display = 'none';
      el.textContent = '';
    }

    function showError(msg) {
      const el = document.getElementById('errorBox');
      el.style.display = 'block';
      el.textContent = msg;
    }

    function hideError() {
      const el = document.getElementById('errorBox');
      el.style.display = 'none';
      el.textContent = '';
    }

    function setDebug(msg) {
      document.getElementById('debugBox').textContent = msg || '';
    }

    function setLoading(flag, text = '正在计算...') {
      const btn = document.getElementById('recommendBtn');
      btn.disabled = flag;
      if (flag) showInfo(text);
      else hideInfo();
    }

    function toLngLat(point) {
      if (point instanceof AMap.LngLat) return point;
      if (Array.isArray(point) && point.length === 2) return new AMap.LngLat(point[0], point[1]);
      throw new Error('坐标格式错误');
    }

    function formatDuration(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.round((seconds % 3600) / 60);
      if (h > 0) return `${h}小时${m}分钟`;
      return `${m}分钟`;
    }

    function formatDistance(meters) {
      if (meters >= 1000) return `${(meters / 1000).toFixed(1)}km`;
      return `${meters}m`;
    }

    function loadAmap() {
      return new Promise((resolve, reject) => {
        if (!AMAP_KEY || AMAP_KEY === 'YOUR_AMAP_KEY') {
          reject(new Error('你还没有填写高德 Key。'));
          return;
        }

        if (AMAP_SECURITY_JS_CODE && AMAP_SECURITY_JS_CODE !== 'YOUR_SECURITY_JS_CODE') {
          window._AMapSecurityConfig = {
            securityJsCode: AMAP_SECURITY_JS_CODE
          };
        }

        const script = document.createElement('script');
        script.src = `https://webapi.amap.com/maps?v=2.0&key=${AMAP_KEY}&plugin=AMap.Geocoder,AMap.Driving,AMap.PlaceSearch`;
        script.async = true;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error('高德地图脚本加载失败。请检查 key、securityJsCode 或网络。'));
        document.head.appendChild(script);
      });
    }

    function initMap() {
      map = new AMap.Map('map', {
        zoom: 7,
        center: [119.8, 32.3],
        viewMode: '3D'
      });

      geocoder = new AMap.Geocoder();

      placeSearch = new AMap.PlaceSearch({
        pageSize: 10,
        pageIndex: 1
      });

      drivingDisplay = new AMap.Driving({
        map: map,
        policy: AMap.DrivingPolicy.LEAST_TIME
      });
    }

    function clearMapOverlays() {
      if (markers.length) {
        map.remove(markers);
        markers = [];
      }
      if (drivingDisplay) drivingDisplay.clear();
    }

    function geocodeAddress(address) {
      return new Promise((resolve, reject) => {
        geocoder.getLocation(address, (status, result) => {
          if (
            status === 'complete' &&
            result &&
            result.geocodes &&
            result.geocodes.length > 0
          ) {
            const loc = result.geocodes[0].location;
            resolve([loc.lng, loc.lat]);
          } else {
            reject(new Error(`地址解析失败：${address}`));
          }
        });
      });
    }

    async function ensureVenueLngLat(match) {
      if (Array.isArray(match.lnglat) && match.lnglat.length === 2) {
        return match.lnglat;
      }
      const lnglat = await geocodeAddress(match.address);
      match.lnglat = lnglat;
      return lnglat;
    }

    function calcDriving(origin, destination) {
      return new Promise((resolve) => {
        const drivingCalc = new AMap.Driving({
          policy: AMap.DrivingPolicy.LEAST_TIME
        });

        drivingCalc.search(
          toLngLat(origin),
          toLngLat(destination),
          (status, result) => {
            if (
              status === 'complete' &&
              result &&
              result.routes &&
              result.routes.length > 0
            ) {
              const route = result.routes[0];
              resolve({
                ok: true,
                distance: route.distance,
                time: route.time,
                raw: result
              });
            } else {
              resolve({
                ok: false,
                status,
                raw: result
              });
            }
          }
        );
      });
    }

    function dedupePois(pois) {
      const seen = new Set();
      const result = [];

      for (const poi of pois) {
        const key = `${poi.name || ''}_${poi.address || ''}`;
        if (!seen.has(key)) {
          seen.add(key);
          result.push(poi);
        }
      }

      return result;
    }

    function searchNearbyByKeyword(keyword, center, radius) {
      return new Promise((resolve) => {
        placeSearch.searchNearBy(keyword, center, radius, (status, result) => {
          if (
            status === 'complete' &&
            result &&
            result.poiList &&
            result.poiList.pois
          ) {
            resolve(result.poiList.pois);
          } else {
            resolve([]);
          }
        });
      });
    }

    async function searchNearbyRestaurants(center) {
      const all = [];

      all.push(...await searchNearbyByKeyword('餐饮服务', center, 2000));

      if (all.length < 3) {
        all.push(...await searchNearbyByKeyword('餐饮服务', center, 5000));
      }

      if (all.length < 3) {
        all.push(...await searchNearbyByKeyword('美食', center, 5000));
      }

      if (all.length < 3) {
        all.push(...await searchNearbyByKeyword('中餐厅', center, 8000));
      }

      return dedupePois(all).slice(0, 3);
    }

    async function searchNearbySpots(center) {
      const all = [];

      all.push(...await searchNearbyByKeyword('风景名胜', center, 3000));

      if (all.length < 3) {
        all.push(...await searchNearbyByKeyword('风景名胜', center, 8000));
      }

      if (all.length < 3) {
        all.push(...await searchNearbyByKeyword('旅游景点', center, 8000));
      }

      if (all.length < 3) {
        all.push(...await searchNearbyByKeyword('公园', center, 8000));
      }

      if (all.length < 3) {
        all.push(...await searchNearbyByKeyword('广场', center, 8000));
      }

      return dedupePois(all).slice(0, 3);
    }

    function createPoiMarker(lng, lat, text, bgColor, title) {
      return new AMap.Marker({
        position: [lng, lat],
        title,
        content: `
          <div style="
            width: 24px;
            height: 24px;
            border-radius: 999px;
            background: ${bgColor};
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,.25);
          ">${text}</div>
        `,
        offset: new AMap.Pixel(-12, -12)
      });
    }

    async function scoreMatch(match, team, originLngLat) {
      const venueLngLat = await ensureVenueLngLat(match);
      const route = await calcDriving(originLngLat, venueLngLat);

      if (!route.ok) {
        return {
          match,
          ok: false,
          totalScore: -1,
          driveInfo: null,
          reason: `路线失败: ${match.home} vs ${match.away}`
        };
      }

      const teamScore = (match.home === team || match.away === team) ? 100 : 30;

      const timeHours = route.time / 3600;
      let distanceScore = 0;

      if (timeHours <= 1) distanceScore = 100;
      else if (timeHours <= 2) distanceScore = 80;
      else if (timeHours <= 3) distanceScore = 60;
      else distanceScore = 30;

      const totalScore = Math.round(
        teamScore * 0.6 +
        distanceScore * 0.25 +
        match.heat * 0.15
      );

      return {
        match,
        ok: true,
        totalScore,
        driveInfo: route
      };
    }

    function renderResult(best, restaurants, spots, selectedTeam) {
      document.getElementById('resultEmpty').style.display = 'none';
      document.getElementById('resultContent').style.display = 'block';

      const { match, totalScore, driveInfo } = best;

      document.getElementById('matchTitle').textContent = `${match.home} vs ${match.away}`;
      document.getElementById('matchDate').textContent = match.date;
      document.getElementById('venueName').textContent = match.venue;
      document.getElementById('venueAddress').textContent = match.address;
      document.getElementById('travelTime').textContent = formatDuration(driveInfo.time);
      document.getElementById('travelDistance').textContent = formatDistance(driveInfo.distance);
      document.getElementById('matchScore').textContent = `${totalScore}分`;

      const reasons = [];
      if (match.home === selectedTeam || match.away === selectedTeam) {
        reasons.push('已按你支持球队优先逻辑筛选');
      } else {
        reasons.push('当前没有你支持球队的可用比赛，退回到全局推荐');
      }
      reasons.push(`预计驾车约 ${formatDuration(driveInfo.time)}`);
      reasons.push(`比赛热度 ${match.heat} 分`);

      document.getElementById('reason').innerHTML = reasons.join('；');

      const restaurantList = document.getElementById('restaurantList');
      restaurantList.innerHTML = '';
      if (!restaurants.length) {
        restaurantList.innerHTML = '<li>附近暂未搜到餐饮。</li>';
      } else {
        restaurants.forEach((poi) => {
          const li = document.createElement('li');
          const dist = poi.distance ? `（约 ${poi.distance} 米）` : '';
          const addr = poi.address || '地址未返回';
          li.innerHTML = `<b>${poi.name}</b>${dist}<br><span class="muted">${addr}</span>`;
          restaurantList.appendChild(li);
        });
      }

      const spotList = document.getElementById('spotList');
      spotList.innerHTML = '';
      if (!spots.length) {
        spotList.innerHTML = '<li>附近暂未搜到景点。</li>';
      } else {
        spots.forEach((poi) => {
          const li = document.createElement('li');
          const dist = poi.distance ? `（约 ${poi.distance} 米）` : '';
          const addr = poi.address || '地址未返回';
          li.innerHTML = `<b>${poi.name}</b>${dist}<br><span class="muted">${addr}</span>`;
          spotList.appendChild(li);
        });
      }
    }

    function renderMap(best, originLngLat, restaurants, spots) {
      clearMapOverlays();

      const originMarker = new AMap.Marker({
        position: toLngLat(originLngLat),
        title: '出发地'
      });

      const venueMarker = new AMap.Marker({
        position: toLngLat(best.match.lnglat),
        title: best.match.venue
      });

      markers.push(originMarker, venueMarker);

      restaurants.forEach((poi) => {
        if (poi.location) {
          const marker = createPoiMarker(
            poi.location.lng,
            poi.location.lat,
            '餐',
            '#2563eb',
            poi.name
          );
          markers.push(marker);
        }
      });

      spots.forEach((poi) => {
        if (poi.location) {
          const marker = createPoiMarker(
            poi.location.lng,
            poi.location.lat,
            '景',
            '#16a34a',
            poi.name
          );
          markers.push(marker);
        }
      });

      map.add(markers);
      map.setFitView(markers);

      drivingDisplay.clear();
      drivingDisplay.search(
        toLngLat(originLngLat),
        toLngLat(best.match.lnglat)
      );
    }

    async function recommend() {
      hideError();
      setDebug('');

      const team = document.getElementById('team').value;
      const originText = document.getElementById('origin').value.trim();

      if (!originText) {
        showError('请先输入你的出发地。');
        return;
      }

      try {
        setLoading(true, '正在计算推荐、路线、餐饮和景点...');

        const originLngLat = await geocodeAddress(originText);

        const results = [];
        for (const match of matches) {
          try {
            const scored = await scoreMatch(match, team, originLngLat);
            results.push(scored);
          } catch (e) {
            results.push({
              match,
              ok: false,
              totalScore: -1,
              driveInfo: null,
              reason: e.message
            });
          }
        }

        const valid = results.filter(item => item.ok);

        if (!valid.length) {
          const failInfo = results.map(r => `${r.match.home} vs ${r.match.away}`).join(' | ');
          setDebug(`全部比赛都没有算出路线。已尝试：${failInfo}`);
          throw new Error('所有比赛的路线规划都失败了。请把出发地写得更具体一些，例如“南京南站”“苏州站”。');
        }

        const favoriteAll = results.filter(item =>
          item.match.home === team || item.match.away === team
        );

        const favoriteValid = favoriteAll.filter(item => item.ok);

        let best = null;

        if (favoriteAll.length === 0) {
          valid.sort((a, b) => b.totalScore - a.totalScore);
          best = valid[0];
        } else if (favoriteValid.length > 0) {
          favoriteValid.sort((a, b) => b.totalScore - a.totalScore);
          best = favoriteValid[0];
        } else {
          const titles = favoriteAll.map(item => `${item.match.home} vs ${item.match.away}`).join(' | ');
          setDebug(`已找到 ${team} 的比赛，但路线规划失败：${titles}`);
          throw new Error(`已找到 ${team} 的比赛，但该场路线规划失败。请检查该比赛地址，或把出发地写得更具体一些。`);
        }

        const [restaurants, spots] = await Promise.all([
          searchNearbyRestaurants(best.match.lnglat),
          searchNearbySpots(best.match.lnglat)
        ]);

        renderResult(best, restaurants, spots, team);
        renderMap(best, originLngLat, restaurants, spots);

        setDebug(
          `推荐成功：${best.match.home} vs ${best.match.away}；` +
          `路线 ${formatDuration(best.driveInfo.time)}，${formatDistance(best.driveInfo.distance)}；` +
          `球场坐标 ${best.match.lnglat ? best.match.lnglat.join(', ') : '未返回'}`
        );
      } catch (err) {
        console.error(err);
        showError(err.message || '发生未知错误。');
      } finally {
        setLoading(false);
      }
    }

    async function boot() {
      try {
        setLoading(true, '正在加载高德地图...');
        await loadAmap();
        initMap();

        document.getElementById('recommendBtn').addEventListener('click', recommend);

        setLoading(false);
        showInfo('地图已加载完成，可以开始推荐。');
        setTimeout(hideInfo, 1800);
      } catch (err) {
        console.error(err);
        setLoading(false);
        showError(err.message || '初始化失败。');
      }
    }

    boot();
  </script>
</body>
</html>
